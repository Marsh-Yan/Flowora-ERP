name: Flowora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Audit all dependencies against official registry
        working-directory: .
        run: pnpm audit --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Test and package
        run: ./mvnw -B -pl services/api -am test package
      - name: Install verified security scanner
        run: bash tools/verification/install-trivy.sh
      - name: Verify security report gate fails closed
        run: python3 -m unittest discover -s tools/verification -p 'test_*.py'
      - name: Scan actual API artifact and enforce security gate
        run: |
          mkdir -p security-reports security-inputs/api
          cp services/api/target/flowora-api-2.0.0-SNAPSHOT.jar security-inputs/api/app.jar
          trivy rootfs --scanners vuln --list-all-pkgs --format json --output security-reports/api-jar.json --timeout 10m security-inputs/api
          python3 tools/verification/security_report.py security-reports/api-jar.json --expected spring-boot
      - name: Retain dependency scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-security-${{ github.sha }}
          path: security-reports/*.json
          if-no-files-found: ignore
          retention-days: 14

  inventory-mysql:
    name: Isolated MySQL HTTP regression
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: r2-ci-only-password
          MYSQL_DATABASE: audit_flowora
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pr2-ci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      FLOWORA_R2_MYSQL_URL: jdbc:mysql://127.0.0.1:13306/audit_flowora?serverTimezone=UTC
      FLOWORA_R2_MYSQL_PASSWORD: r2-ci-only-password
      FLOWORA_R2_EMPTY_CI_DATABASE: 'true'
      DB_URL: jdbc:mysql://127.0.0.1:13306/audit_flowora?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: r2-ci-only-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 16379
      REDIS_PASSWORD: ''
      FLOWORA_MFA_ENCRYPTION_KEY: r2-ci-only-mfa-key-32-characters-minimum
      FLOWORA_R2_HTTP_PASSWORD: Demo123!
      FLOWORA_R3_HTTP_PASSWORD: Demo123!
      FLOWORA_R5_HTTP_PASSWORD: Demo123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Test historical cutover, repeated demo initialization, fulfillment and cancellation races
        run: ./mvnw -B -pl services/api -Dtest=TradeInventoryMySqlTest test package
      - name: Test finance source boundaries, base balance, FX reversal, valuation and bank direction
        run: ./mvnw -B -pl services/api -Dtest=FinanceMySqlTest test
      - name: Test scheduled outbox concurrency, rollback recovery, dead metrics and approval cards
        run: ./mvnw -B -pl services/api -Dtest=WorkflowOperationsMySqlTest test
      - name: Start disposable API with demo fixtures
        run: |
          java -jar services/api/target/flowora-api-2.0.0-SNAPSHOT.jar --spring.profiles.active=local --server.port=18080 --server.address=127.0.0.1 --management.endpoint.health.probes.enabled=true --flowora.demo.enabled=true --flowora.demo.seed-on-start=true --flowora.cors.allowed-origins=http://127.0.0.1:15173 > /tmp/r2-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health/readiness >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify compatibility multi-line fulfillment and native returns through HTTP
        shell: pwsh
        run: ./tools/verification/compat-stock-smoke.ps1
      - name: Verify finance posting, FX reversal and input contracts through HTTP
        shell: pwsh
        run: ./tools/verification/finance-smoke.ps1
      - name: Verify real session, MFA, permissions, attachment boundaries and workflow CORS through HTTP
        shell: pwsh
        run: ./tools/verification/security-smoke.ps1 | Tee-Object -FilePath /tmp/r5-security-results.txt
      - name: Retain sanitized security scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scenarios-${{ github.sha }}
          path: /tmp/r5-security-results.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Show API errors on failure
        if: failure()
        run: tail -100 /tmp/r2-api.log || true

  production-smoke:
    name: Production Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASSWORD: ci-db-only-password
      DB_ROOT_PASSWORD: ci-root-only-password
      REDIS_PASSWORD: ci-redis-only-password
      FLOWORA_MFA_ENCRYPTION_KEY: ci-only-mfa-encryption-key-32-characters
      FLOWORA_ALLOWED_ORIGINS: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and start target services
        run: docker compose up --build --wait --wait-timeout 300
      - name: Verify readiness through web proxy
        run: curl --fail --retry 20 --retry-delay 3 --retry-connrefused http://localhost:8080/healthz
      - name: Verify target Nginx security headers and cache policy
        run: bash tools/verification/nginx-headers.sh
      - name: Verify dead event alert activation and recovery
        run: docker compose exec -T -w /etc/prometheus prometheus promtool test rules alerts.test.yml
      - name: Verify production did not seed demo users
        run: |
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root -D flowora_erp -N -e "SELECT COUNT(*) FROM flowora_user_account"' | grep -qx 0
      - name: Verify Redis credential boundary
        run: |
          docker compose exec -T redis sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping' | grep -qx PONG
          if docker compose exec -T redis sh -c 'REDISCLI_AUTH=invalid redis-cli ping' 2>&1 | grep -q PONG; then
            echo 'Redis accepted an invalid password' >&2
            exit 1
          fi
      - name: Verify Redis restart recovery
        run: |
          docker compose restart redis
          docker compose up --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/healthz
      - name: Install verified security scanner
        run: bash tools/verification/install-trivy.sh
      - name: Setup Go for actual binary reachability analysis
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install pinned official Go vulnerability analyzer
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan all actual Compose runtime images
        run: |
          mkdir -p security-reports
          failed=0
          for service in api web mysql redis prometheus; do
            image=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q "$service")")
            case "$service" in
              api) expected=spring-boot ;;
              web) expected=nginx ;;
              mysql) expected=mysql ;;
              redis) expected=busybox ;; # upstream Redis is compiled outside the APK inventory
              prometheus) expected=prometheus ;;
            esac
            if ! trivy image --scanners vuln --list-all-pkgs --format json --output "security-reports/$service.json" --timeout 10m "$image"; then failed=1; continue; fi
            extra=()
            if [ "$service" = prometheus ]; then
              mkdir -p security-inputs/prometheus
              docker cp "$(docker compose ps -q prometheus):/bin/prometheus" security-inputs/prometheus/prometheus
              docker cp "$(docker compose ps -q prometheus):/bin/promtool" security-inputs/prometheus/promtool
              extra=(--prometheus-binaries security-inputs/prometheus)
            fi
            if ! python3 tools/verification/security_report.py "security-reports/$service.json" --expected "$expected" "${extra[@]}"; then failed=1; fi
          done
          exit "$failed"
      - name: Retain image scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-security-${{ github.sha }}
          path: security-reports/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Inspect service health on failure
        if: failure()
        run: |
          docker compose ps
          docker inspect --format '{{json .State.Health}}' "$(docker compose ps -q api)"
          docker compose exec -T api sh -c 'command -v curl || true; curl -v http://127.0.0.1:9090/actuator/health/readiness || true'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop disposable services
        if: always()
        run: docker compose down -v

  wrapper-windows:
    name: Windows Maven Wrapper paths
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Verify fresh wrapper install in ordinary directory
        shell: pwsh
        run: |
          $env:MAVEN_USER_HOME = Join-Path $env:RUNNER_TEMP 'maven-home'
          .\mvnw.cmd -version
      - name: Verify wrapper through linked Maven directory
        shell: pwsh
        run: |
          $realHome = Join-Path $env:RUNNER_TEMP 'maven-home'
          $linkHome = Join-Path $env:RUNNER_TEMP 'maven-home-link'
          New-Item -ItemType Junction -Path $linkHome -Target $realHome | Out-Null
          $env:MAVEN_USER_HOME = $linkHome
          .\mvnw.cmd -version
