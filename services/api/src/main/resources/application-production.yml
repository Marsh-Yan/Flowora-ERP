spring:
  config:
    activate:
      on-profile: production
  autoconfigure:
    exclude: []
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      data-source-properties:
        connectionTimeZone: "+00:00"
        forceConnectionTimeZoneToSession: true
        preserveInstants: true
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}
      connection-timeout: 10000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3s
  session:
    data:
      redis:
        repository-type: indexed
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

management:
  server.port: 9090
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate.enabled: true
    readinessstate.enabled: true

logging:
  structured:
    format:
      console: logstash

flowora:
  release:
    version: ${FLOWORA_RELEASE_VERSION:2.0.0}
    stage: M5
    v2-business-writes-enabled: true
  demo:
    enabled: false
  compatibility:
    v1-read-only: true
  cors:
    allowed-origins: ${FLOWORA_ALLOWED_ORIGINS}
  security:
    mfa-encryption-key: ${FLOWORA_MFA_ENCRYPTION_KEY}
  attachment:
    root: ${FLOWORA_ATTACHMENT_ROOT:/var/lib/flowora/attachments}
  export:
    root: ${FLOWORA_EXPORT_ROOT:/var/lib/flowora/exports}
