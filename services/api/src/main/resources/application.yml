spring:
  application:
    name: flowora-api
  profiles:
    default: standalone
    group:
      demo: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  session:
    timeout: 8h

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${FLOWORA_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

flowora:
  release:
    version: ${FLOWORA_RELEASE_VERSION:2.0.0-SNAPSHOT}
    stage: ${FLOWORA_RELEASE_STAGE:M3}
    v2-business-writes-enabled: ${FLOWORA_V2_BUSINESS_WRITES_ENABLED:false}
  security:
    max-login-failures: ${FLOWORA_MAX_LOGIN_FAILURES:5}
    login-lock-minutes: ${FLOWORA_LOGIN_LOCK_MINUTES:15}
    password-history: ${FLOWORA_PASSWORD_HISTORY:5}
  workflow:
    outbox-delay-ms: ${FLOWORA_OUTBOX_DELAY_MS:5000}
    sla-scan-delay-ms: ${FLOWORA_SLA_SCAN_DELAY_MS:60000}
  attachment:
    root: ${FLOWORA_ATTACHMENT_ROOT:.flowora/attachments}
    max-bytes: ${FLOWORA_ATTACHMENT_MAX_BYTES:20971520}
    allowed-types: ${FLOWORA_ATTACHMENT_ALLOWED_TYPES:application/pdf,image/png,image/jpeg,text/plain,text/csv}
  cors:
    allowed-origins: http://localhost:5173
  demo:
    enabled: false
