components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Resource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [customers, suppliers, items, warehouses, currencies, exchange-rates, tax-rates, accounts]
    ResourceType:
      name: resourceType
      in: path
      required: true
      schema:
        type: string
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
    Query:
      name: query
      in: query
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  schemas:
    SalesQuoteCreate:
      type: object
      required: [customerId, itemId, quantity, unitPrice, discountRate, taxRate, currencyCode, validUntil]
      properties:
        customerId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantity: { type: number, format: double, minimum: 0.0001 }
        unitPrice: { type: number, format: double, minimum: 0 }
        discountRate: { type: number, format: double, minimum: 0, maximum: 100 }
        taxRate: { type: number, format: double, minimum: 0, maximum: 100 }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        validUntil: { type: string, format: date }
        note: { type: string, maxLength: 500 }
    SalesOrderCreate:
      type: object
      required: [customerId, warehouseId, itemId, quantity, unitPrice, discountRate, taxRate, currencyCode]
      properties:
        quoteId: { type: string, format: uuid, nullable: true }
        customerId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantity: { type: number, format: double, minimum: 0.0001 }
        unitPrice: { type: number, format: double, minimum: 0 }
        discountRate: { type: number, format: double, minimum: 0, maximum: 100 }
        taxRate: { type: number, format: double, minimum: 0, maximum: 100 }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        dueDate: { type: string, format: date, nullable: true }
        note: { type: string, maxLength: 500 }
    DeliveryCreate:
      type: object
      required: [salesOrderId, salesOrderLineId, warehouseId, quantity]
      properties:
        salesOrderId: { type: string, format: uuid }
        salesOrderLineId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity: { type: number, format: double, minimum: 0.0001 }
    PaymentCreate:
      type: object
      required: [receivableId, amount, method, paymentDate]
      properties:
        receivableId: { type: string, format: uuid }
        amount: { type: number, format: double, minimum: 0.0001 }
        method: { type: string, enum: [BANK, CASH, OTHER] }
        paymentDate: { type: string, format: date }
        reference: { type: string, maxLength: 120 }
    PurchaseRequestCreate:
      type: object
      required: [supplierId, warehouseId, itemId, quantity, estimatedUnitCost]
      properties:
        supplierId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantity: { type: number, format: double, minimum: 0.0001 }
        estimatedUnitCost: { type: number, format: double, minimum: 0 }
        note: { type: string, maxLength: 500 }
    PurchaseOrderCreate:
      type: object
      required: [supplierId, warehouseId, itemId, quantity, unitPrice, taxRate]
      properties:
        purchaseRequestId: { type: string, format: uuid, nullable: true }
        supplierId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantity: { type: number, format: double, minimum: 0.0001 }
        unitPrice: { type: number, format: double, minimum: 0 }
        taxRate: { type: number, format: double, minimum: 0 }
        expectedDate: { type: string, format: date, nullable: true }
        note: { type: string, maxLength: 500 }
    PurchaseReceiptRequest:
      type: object
      required: [purchaseOrderId, purchaseOrderLineId, warehouseId, quantity, unitCost]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        purchaseOrderLineId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity: { type: number, format: double, minimum: 0.0001 }
        unitCost: { type: number, format: double, minimum: 0 }
    StockTransferRequest:
      type: object
      required: [sourceWarehouseId, targetWarehouseId, itemId, quantity, unitCost]
      properties:
        sourceWarehouseId: { type: string, format: uuid }
        targetWarehouseId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantity: { type: number, format: double, minimum: 0.0001 }
        unitCost: { type: number, format: double, minimum: 0 }
    StockCountRequest:
      type: object
      required: [warehouseId, itemId, countedQuantity, unitCost]
      properties:
        warehouseId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        countedQuantity: { type: number, format: double, minimum: 0 }
        unitCost: { type: number, format: double, minimum: 0 }
    StockAdjustmentRequest:
      type: object
      required: [warehouseId, itemId, quantityDelta, unitCost, reason]
      properties:
        warehouseId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantityDelta: { type: number, format: double }
        unitCost: { type: number, format: double, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    WorkflowTaskRequest:
      type: object
      required: [resourceType, resourceId, title, amount]
      properties:
        resourceType: { type: string, enum: [PURCHASE_REQUEST, PURCHASE_ORDER, SALES_QUOTE, SALES_ORDER, INVENTORY_ADJUSTMENT, PROJECT, GENERAL] }
        resourceId: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        amount: { type: number, format: double, minimum: 0 }
        assigneeUserId: { type: string, maxLength: 64 }
        dueAt: { type: string, format: date-time }
    WorkflowActionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [APPROVE, REJECT, TRANSFER, COMPLETE, CANCEL] }
        transferToUserId: { type: string, maxLength: 64 }
        comment: { type: string, maxLength: 1000 }
    WorkflowCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 2000 }
    WorkflowTask:
      type: object
      required: [id, resourceType, resourceId, title, amount, status]
      properties:
        id: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        title: { type: string }
        description: { type: string }
        amount: { type: number, format: double }
        requesterUserId: { type: string }
        assigneeUserId: { type: string }
        assigneeRole: { type: string }
        status: { type: string, enum: [OPEN, APPROVED, REJECTED, TRANSFERRED, COMPLETED, CANCELLED] }
        dueAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    WorkflowNotification:
      type: object
      required: [id, type, title, message, read, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    WorkflowAction:
      type: object
      required: [task, action, notificationCreated]
      properties:
        task: { $ref: '#/components/schemas/WorkflowTask' }
        action: { type: string }
        notificationCreated: { type: boolean }
    ApiResponseWorkflowTask:
      type: object
      properties:
        data: { $ref: '#/components/schemas/WorkflowTask' }
        requestId: { type: string }
    ApiResponseWorkflowTaskPage:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: object
              properties:
                content:
                  type: array
                  items: { $ref: '#/components/schemas/WorkflowTask' }
        requestId: { type: string }
    ApiResponseWorkflowAction:
      type: object
      properties:
        data: { $ref: '#/components/schemas/WorkflowAction' }
        requestId: { type: string }
    ApiResponseNotificationPage:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: object
              properties:
                content:
                  type: array
                  items: { $ref: '#/components/schemas/WorkflowNotification' }
        requestId: { type: string }
    ApiResponseUnreadCount:
      type: object
      properties:
        data:
          type: object
          properties:
            count: { type: integer, format: int64 }
        requestId: { type: string }
    PageMeta:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: {}
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    CustomerRequest:
      type: object
      required: [code, name, currencyCode, paymentTermsDays, active]
      properties:
        code: { type: string, maxLength: 48, example: C-0001 }
        name: { type: string, maxLength: 160, example: Acme Trading }
        contactName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        currencyCode: { type: string, minLength: 3, maxLength: 3, example: USD }
        paymentTermsDays: { type: integer, minimum: 0, example: 30 }
        active: { type: boolean, default: true }
    SupplierRequest:
      allOf:
        - $ref: '#/components/schemas/CustomerRequest'
    ItemRequest:
      type: object
      required: [code, name, type, unit, salesPrice, purchasePrice, averageCost, taxRate, active]
      properties:
        code: { type: string, example: SKU-0001 }
        name: { type: string, example: Consulting service }
        type: { type: string, enum: [GOODS, SERVICE] }
        unit: { type: string, example: pcs }
        salesPrice: { type: number, format: double, minimum: 0 }
        purchasePrice: { type: number, format: double, minimum: 0 }
        averageCost: { type: number, format: double, minimum: 0 }
        taxRate: { type: number, format: double, minimum: 0, maximum: 100 }
        inventoryManaged: { type: boolean }
        active: { type: boolean }
    WarehouseRequest:
      type: object
      required: [code, name, active]
      properties:
        code: { type: string, example: WH-MAIN }
        name: { type: string, example: Main warehouse }
        address: { type: string }
        active: { type: boolean }
    OrganizationSettingsRequest:
      type: object
      required: [name, baseCurrencyCode, timezone, approvalThreshold, defaultTaxRate]
      properties:
        name: { type: string }
        baseCurrencyCode: { type: string, example: USD }
        timezone: { type: string, example: Asia/Shanghai }
        approvalThreshold: { type: number, format: double, minimum: 0 }
        defaultTaxRate: { type: number, format: double, minimum: 0, maximum: 100 }
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerRequest'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Supplier:
      allOf:
        - $ref: '#/components/schemas/Customer'
    Item:
      allOf:
        - $ref: '#/components/schemas/ItemRequest'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Warehouse:
      allOf:
        - $ref: '#/components/schemas/WarehouseRequest'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Currency:
      type: object
      required: [id, code, name, symbol, decimalPlaces, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        symbol: { type: string }
        decimalPlaces: { type: integer }
        active: { type: boolean }
    ExchangeRate:
      type: object
      required: [id, baseCurrencyCode, quoteCurrencyCode, rate, effectiveDate, active]
      properties:
        id: { type: string, format: uuid }
        baseCurrencyCode: { type: string }
        quoteCurrencyCode: { type: string }
        rate: { type: number, format: double }
        effectiveDate: { type: string, format: date }
        active: { type: boolean }
    TaxRate:
      type: object
      required: [id, code, name, rate, exempt, effectiveDate, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        rate: { type: number, format: double }
        exempt: { type: boolean }
        effectiveDate: { type: string, format: date }
        active: { type: boolean }
    Account:
      type: object
      required: [id, code, name, type, postingAllowed, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE] }
        parentCode: { type: string, nullable: true }
        postingAllowed: { type: boolean }
        active: { type: boolean }
    OrganizationSettings:
      allOf:
        - $ref: '#/components/schemas/OrganizationSettingsRequest'
        - type: object
          required: [id, active]
          properties:
            id: { type: string }
            active: { type: boolean }
    ApiResponseCustomer:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/Customer' }
        requestId: { type: string }
    ApiResponseSupplier:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/Supplier' }
        requestId: { type: string }
    ApiResponseItem:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/Item' }
        requestId: { type: string }
    ApiResponseWarehouse:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/Warehouse' }
        requestId: { type: string }
    ApiResponseOrganizationSettings:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/OrganizationSettings' }
        requestId: { type: string }
    ApiResponseImportResult:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [imported, rejected, errors]
          properties:
            imported: { type: integer }
            rejected: { type: integer }
            errors:
              type: array
              items: { type: object, additionalProperties: true }
        requestId: { type: string }
    ApiResponseCustomerPage:
      allOf: [{ $ref: '#/components/schemas/ApiResponsePage' }]
    ApiResponseSupplierPage:
      allOf: [{ $ref: '#/components/schemas/ApiResponsePage' }]
    ApiResponseItemPage:
      allOf: [{ $ref: '#/components/schemas/ApiResponsePage' }]
    ApiResponseWarehousePage:
      allOf: [{ $ref: '#/components/schemas/ApiResponsePage' }]
    ApiResponseCurrencyPage:
      allOf: [{ $ref: '#/components/schemas/ApiResponsePage' }]
    ApiResponseExchangeRatePage:
      allOf: [{ $ref: '#/components/schemas/ApiResponsePage' }]
    ApiResponseTaxRatePage:
      allOf: [{ $ref: '#/components/schemas/ApiResponsePage' }]
    ApiResponseAccountPage:
      allOf: [{ $ref: '#/components/schemas/ApiResponsePage' }]
    ApiResponsePage:
      type: object
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/PageMeta'
        requestId: { type: string }
    ApiResponseHealth:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [service, status]
          properties:
            service:
              type: string
              example: flowora-api
            status:
              type: string
              example: UP
        requestId:
          type: string
          example: req_01J123456789
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          format: email
          example: operator@demo.flowora
        password:
          type: string
          format: password
          example: Demo123!
    AuthUser:
      type: object
      required: [id, username, displayName, organizationId, organizationName, roles]
      properties:
        id:
          type: string
          example: user-demo-operator
        username:
          type: string
          example: operator@demo.flowora
        displayName:
          type: string
