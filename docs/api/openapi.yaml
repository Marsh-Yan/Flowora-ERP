openapi: 3.0.3
info:
  title: Flowora ERP API
  version: 0.1.0
  description: |
    Stable API contract for the Flowora ERP demo.
    User-facing text is represented by message keys.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHealth'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Get the CSRF token cookie and token value
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCsrf'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Start an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user and organization context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthUser'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthUser'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the authenticated session
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogout'
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects and delivery metrics
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [PLANNED, ACTIVE, AT_RISK, COMPLETED, ARCHIVED] } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Project page
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseProjectPage' } } }
    post:
      operationId: createProject
      summary: Create a project optionally linked to a customer and sales order
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectCreate' } } }
      responses:
        '200':
          description: Created project
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseProject' } } }
  /api/v1/projects/{id}/summary:
    get:
      operationId: getProjectSummary
      summary: Get project progress, cost and billing metrics
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Project summary
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseProject' } } }
  /api/v1/projects/{id}/status:
    post:
      operationId: changeProjectStatus
      summary: Change a project status
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectStatusChange' } } }
      responses:
        '200':
          description: Updated project
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseProject' } } }
  /api/v1/projects/{id}/milestones:
    get:
      operationId: listProjectMilestones
      summary: List project milestones
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Milestones
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseMilestones' } } }
    post:
      operationId: createProjectMilestone
      summary: Add a milestone
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MilestoneCreate' } } }
      responses:
        '200':
          description: Created milestone
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseMilestone' } } }
  /api/v1/projects/{id}/tasks:
    get:
      operationId: listProjectTasks
      summary: List project tasks
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Task page
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseTaskPage' } } }
    post:
      operationId: createProjectTask
      summary: Add a project task
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskCreate' } } }
      responses:
        '200':
          description: Created task
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseTask' } } }
  /api/v1/projects/{id}/timesheets:
    get:
      operationId: listProjectTimesheets
      summary: List project timesheets
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Timesheet page
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseTimesheetPage' } } }
    post:
      operationId: createProjectTimesheet
      summary: Log project hours
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TimesheetCreate' } } }
      responses:
        '200':
          description: Created timesheet
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseTimesheet' } } }
  /api/v1/projects/{id}/expenses:
    post:
      operationId: createProjectExpense
      summary: Record a project expense
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExpenseCreate' } } }
      responses:
        '200':
          description: Created expense
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseExpense' } } }
  /api/v1/projects/{id}/billing-basis:
    get:
      operationId: listProjectBillingBasis
      summary: List pending billable project basis
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Pending billing basis rows
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseBillingBasis' } } }
  /api/v1/organizations/settings:
    get:
      operationId: getOrganizationSettings
      summary: Get organization settings
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Organization settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrganizationSettings'
    put:
      operationId: updateOrganizationSettings
      summary: Update organization settings
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationSettingsRequest'
      responses:
        '200':
          description: Updated organization settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrganizationSettings'
        '403':
          description: Administrator role required
  /api/v1/masters/customers:
    get:
      operationId: listCustomers
      summary: Search customers with pagination
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Customer page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCustomerPage'
    post:
      operationId: createCustomer
      summary: Create a customer
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: Created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCustomer'
  /api/v1/masters/customers/{id}:
    put:
      operationId: updateCustomer
      summary: Update a customer
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCustomer'
    delete:
      operationId: deactivateCustomer
      summary: Deactivate a customer
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Customer deactivated
  /api/v1/masters/suppliers:
    get:
      operationId: listSuppliers
      summary: Search suppliers with pagination
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Supplier page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupplierPage'
    post:
      operationId: createSupplier
      summary: Create a supplier
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequest'
      responses:
        '200':
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupplier'
  /api/v1/masters/items:
    get:
      operationId: listItems
      summary: Search items and services with pagination
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Item page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseItemPage'
    post:
      operationId: createItem
      summary: Create an item or service
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
      responses:
        '200':
          description: Created item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseItem'
  /api/v1/masters/warehouses:
    get:
      operationId: listWarehouses
      summary: Search warehouses with pagination
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Warehouse page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWarehousePage'
    post:
      operationId: createWarehouse
      summary: Create a warehouse
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
      responses:
        '200':
          description: Created warehouse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWarehouse'
  /api/v1/masters/currencies:
    get:
      operationId: listCurrencies
      summary: Search currencies with pagination
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Currency page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCurrencyPage'
  /api/v1/masters/exchange-rates:
    get:
      operationId: listExchangeRates
      summary: Search exchange rates with pagination
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Exchange rate page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseExchangeRatePage'
  /api/v1/masters/tax-rates:
    get:
      operationId: listTaxRates
      summary: Search tax rates with pagination
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Tax rate page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaxRatePage'
  /api/v1/masters/accounts:
    get:
      operationId: listAccounts
      summary: Search accounts with pagination
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Account page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAccountPage'
  /api/v1/masters/{resource}/import:
    post:
      operationId: importMasterData
      summary: Import customer, supplier, item or warehouse CSV data
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Resource'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseImportResult'
  /api/v1/masters/{resource}/export.csv:
    get:
      operationId: exportMasterData
      summary: Export master data as CSV
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Resource'
      responses:
        '200':
          description: UTF-8 CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
  /api/v1/workflow/tasks:
    get:
      operationId: listWorkflowTasks
      summary: List the current user's workflow inbox
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Workflow task page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkflowTaskPage'
    post:
      operationId: createWorkflowTask
      summary: Submit a workflow task
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTaskRequest'
      responses:
        '200':
          description: Created workflow task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkflowTask'
  /api/v1/workflow/tasks/{id}/actions:
    post:
      operationId: actOnWorkflowTask
      summary: Execute a workflow action
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowActionRequest'
      responses:
        '200':
          description: Updated workflow task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkflowAction'
        '409':
          description: Invalid state transition
  /api/v1/workflow/notifications:
    get:
      operationId: listWorkflowNotifications
      summary: List workflow notifications
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Notification page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNotificationPage'
  /api/v1/workflow/notifications/unread-count:
    get:
      operationId: getWorkflowUnreadCount
      summary: Count unread workflow notifications
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUnreadCount'
  /api/v1/workflow/notifications/{id}/read:
    post:
      operationId: markWorkflowNotificationRead
      summary: Mark a workflow notification as read
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated notification
  /api/v1/workflow/resources/{resourceType}/{resourceId}/comments:
    get:
      operationId: listWorkflowComments
      summary: List comments for a business resource
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceType'
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Comment page
    post:
      operationId: addWorkflowComment
      summary: Add a comment to a business resource
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceType'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCommentRequest'
      responses:
        '200':
          description: Created comment
  /api/v1/workflow/resources/{resourceType}/{resourceId}/activities:
    get:
      operationId: listWorkflowActivities
      summary: List the activity timeline for a business resource
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceType'
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Activity page
  /api/v1/procurement/requests:
    get:
      operationId: listPurchaseRequests
      summary: List purchase requests
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Purchase request page
    post:
      operationId: createPurchaseRequest
      summary: Create and submit a purchase request
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequestCreate'
      responses:
        '200':
          description: Created purchase request
  /api/v1/procurement/orders:
    get:
      operationId: listPurchaseOrders
      summary: List purchase orders
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Purchase order page
    post:
      operationId: createPurchaseOrder
      summary: Create a purchase order from an approved request
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCreate'
      responses:
        '200':
          description: Created purchase order
  /api/v1/procurement/orders/{id}:
    delete:
      operationId: cancelPurchaseOrder
      summary: Cancel an unreceived purchase order
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Purchase order cancelled
  /api/v1/inventory/balances:
    get:
      operationId: listStockBalances
      summary: List stock balances by warehouse
      security:
        - sessionCookie: []
      parameters:
        - name: warehouseId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Stock balance page
  /api/v1/inventory/ledger:
    get:
      operationId: listStockLedger
      summary: List stock ledger entries
      security:
        - sessionCookie: []
      parameters:
        - name: warehouseId
          in: query
          schema: { type: string }
        - name: itemId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Stock ledger page
  /api/v1/inventory/receipts:
    post:
      operationId: receivePurchaseOrder
      summary: Receive part or all of a purchase order line
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseReceiptRequest'
      responses:
        '200':
          description: Receipt posted and stock ledger updated
  /api/v1/inventory/transfers:
    post:
      operationId: transferStock
      summary: Transfer stock between warehouses
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockTransferRequest'
      responses:
        '200':
          description: Transfer posted with two ledger entries
  /api/v1/inventory/counts:
    post:
      operationId: postStockCount
      summary: Post a stock count variance
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockCountRequest'
      responses:
        '200':
          description: Stock count posted
  /api/v1/inventory/adjustments:
    post:
      operationId: createStockAdjustment
      summary: Post or submit a stock adjustment for approval
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
      responses:
        '200':
          description: Adjustment posted or awaiting approval
  /api/v1/inventory/adjustments/{id}/approve:
    post:
      operationId: approveStockAdjustment
      summary: Approve and post a high-risk stock adjustment
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Adjustment approved and posted
  /api/v1/inventory/adjustments/{id}/reject:
    post:
      operationId: rejectStockAdjustment
      summary: Reject a high-risk stock adjustment
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Adjustment rejected
  /api/v1/sales/quotes:
    get:
      operationId: listSalesQuotes
      summary: List sales quotes
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Sales quote page
    post:
      operationId: createSalesQuote
      summary: Create and submit a sales quote for approval
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
