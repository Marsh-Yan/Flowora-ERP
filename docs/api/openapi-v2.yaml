openapi: 3.0.3
info:
  title: Flowora ERP API v2 M5
  version: 2.0.0-SNAPSHOT
  description: M5 contract for the complete 2.0 platform, analytics, governed exports, diagnostics and read-only v1 compatibility.
servers:
  - url: http://localhost:8080
security:
  - sessionCookie: []
paths:
  /api/v2/system/version:
    get:
      operationId: getApiVersion
      security: []
      responses:
        "200": { $ref: "#/components/responses/Success" }

  /api/v2/session/csrf:
    get:
      operationId: getCsrfToken
      security: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/session/login:
    post:
      operationId: loginV2
      security: []
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
  /api/v2/session/me:
    get:
      operationId: getSessionUser
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/session/organizations:
    get:
      operationId: listAvailableOrganizations
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/session/switch-organization:
    post:
      operationId: switchOrganization
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v2/session/change-password:
    post:
      operationId: changePassword
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v2/session/logout:
    post:
      operationId: logoutV2
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/session/active:
    get:
      operationId: listActiveSessions
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/session/active/{sessionId}/revoke:
    post:
      operationId: revokeSession
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/session/mfa/enroll:
    post:
      operationId: startMfaEnrollment
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/session/mfa/confirm:
    post:
      operationId: confirmMfaEnrollment
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/session/mfa/disable:
    post:
      operationId: disableMfa
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/organizations:
    get:
      operationId: listOrganizations
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      operationId: createOrganization
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v2/departments:
    get:
      operationId: listDepartments
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      operationId: createDepartment
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/users:
    get:
      operationId: listUsers
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      operationId: createUser
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/roles:
    get:
      operationId: listRoles
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      operationId: createRole
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/permissions:
    get:
      operationId: listPermissions
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/masters/locations:
    get:
      operationId: listStockLocations
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      operationId: createStockLocation
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/masters/locations/{locationId}:
    put:
      operationId: updateStockLocation
      parameters:
        - { name: locationId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/masters/items/{itemId}/tracking:
    put:
      operationId: updateItemTracking
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/masters/tax-rules:
    get:
      operationId: listTaxRules
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      operationId: createTaxRule
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/workflows/templates:
    get:
      operationId: listWorkflowTemplates
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      operationId: createWorkflowTemplate
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v2/workflows/templates/{templateId}/versions:
    post:
      operationId: createWorkflowVersion
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/workflows/instances:
    post:
      operationId: startWorkflowInstance
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/workflows/instances/{instanceId}/decisions:
    get:
      operationId: listWorkflowDecisions
      parameters: [{ name: instanceId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/workflows/tasks:
    get:
      operationId: listWorkflowTasksV2
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [MINE, STARTED, PROCESSED] } }
        - { name: overdue, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/workflows/tasks/{taskId}/actions:
    post:
      operationId: actOnWorkflowTaskV2
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/workflows/delegations:
    get:
      operationId: listWorkflowDelegations
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      operationId: createWorkflowDelegation
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/workflows/outbox/{eventId}/replay:
    post:
      operationId: replayWorkflowOutboxEvent
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/collaboration/resources/{resourceType}/{resourceId}/comments:
    get:
      operationId: listResourceCommentsV2
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      operationId: addResourceCommentV2
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/collaboration/resources/{resourceType}/{resourceId}/attachments:
    get:
      operationId: listResourceAttachments
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      operationId: uploadResourceAttachment
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v2/collaboration/attachments/{attachmentId}/content:
    get:
      operationId: downloadResourceAttachment
      responses:
        "200": { description: Protected attachment stream }
        "403": { $ref: "#/components/responses/Error" }
  /api/v2/collaboration/notifications:
    get:
      operationId: listNotificationsV2
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/sales/orders:
    post:
      operationId: createSalesOrderV2
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/sales/orders/{id}:
    get:
      operationId: getSalesOrderV2
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/sales/orders/{id}/confirm:
    post:
      operationId: confirmSalesOrderV2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/procurement/orders:
    post:
      operationId: createPurchaseOrderV2
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/procurement/orders/{id}:
    get:
      operationId: getPurchaseOrderV2
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/inventory/availability:
    get:
      operationId: listInventoryAvailability
      parameters:
        - { name: warehouseId, in: query, schema: { type: string } }
        - { name: itemId, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/inventory/receipts:
    post:
      operationId: postInventoryReceipt
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/inventory/reservations:
    post:
      operationId: reserveInventory
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/inventory/shipments:
    post:
      operationId: postInventoryShipment
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/inventory/transfers:
    post:
      operationId: postInventoryTransfer
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/inventory/freezes:
    post:
      operationId: freezeInventory
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/inventory/trace:
    get:
      operationId: traceInventory
      parameters:
        - { name: itemId, in: query, required: true, schema: { type: string } }
        - { name: lotId, in: query, schema: { type: string } }
        - { name: serialId, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/sales/returns:
    post:
      operationId: postSalesReturn
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/procurement/returns:
    post:
      operationId: postPurchaseReturn
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/trade/financial-source-events:
    get:
      operationId: listTradeFinancialSourceEvents
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/sales/orders/{id}/cancel:
    post:
      operationId: cancelSalesOrderV2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/procurement/orders/{id}/confirm:
    post:
      operationId: confirmPurchaseOrderV2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/procurement/orders/{id}/cancel:
    post:
      operationId: cancelPurchaseOrderV2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/inventory/reservations/{reservationId}/release:
    post:
      operationId: releaseInventoryReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/inventory/reservations/expire:
    post:
      operationId: expireInventoryReservations
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/inventory/counts:
    post:
      operationId: postInventoryCount
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/inventory/freezes/{freezeId}/release:
    post:
      operationId: releaseInventoryFreeze
      parameters:
        - { name: freezeId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v2/finance/invoices:
    get:
      operationId: listFormalInvoices
      responses: { "200": { $ref: "#/components/responses/Success" } }
    post:
      operationId: createFormalInvoice
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/finance/invoices/{invoiceId}/post:
    post:
      operationId: postFormalInvoice
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "409": { $ref: "#/components/responses/Error" } }
  /api/v2/finance/payments:
    get:
      operationId: listFinancePayments
      responses: { "200": { $ref: "#/components/responses/Success" } }
    post:
      operationId: createFinancePayment
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/finance/payments/{paymentId}/allocations:
    post:
      operationId: allocateFinancePayment
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "409": { $ref: "#/components/responses/Error" } }
  /api/v2/finance/journals:
    get:
      operationId: listPostedJournals
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/finance/bank/statements/import:
    post:
      operationId: importBankStatement
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "409": { $ref: "#/components/responses/Error" } }
  /api/v2/finance/bank/reconciliations:
    get:
      operationId: listBankReconciliations
      responses: { "200": { $ref: "#/components/responses/Success" } }
    post:
      operationId: createBankReconciliation
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/finance/reports/trial-balance:
    get:
      operationId: getTrialBalanceV2
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/finance/dashboard:
    get:
      operationId: getFinanceDashboard
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/projects/{projectId}/billing-basis:
    get:
      operationId: listProjectBillingBasisV2
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/projects/{projectId}/invoices:
    post:
      operationId: createProjectInvoice
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/projects/{projectId}/profitability:
    get:
      operationId: getProjectProfitability
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { $ref: "#/components/responses/Success" } }

  /api/v2/analytics/workspace:
    get:
      operationId: getRoleWorkspace
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/analytics/snapshot:
    get:
      operationId: getAnalyticsSnapshot
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/analytics/organizations:
    get:
      operationId: getCrossOrganizationAnalytics
      parameters: [{ name: reportCurrency, in: query, schema: { type: string, default: USD } }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "403": { $ref: "#/components/responses/Error" } }
  /api/v2/analytics/views:
    get:
      operationId: listSavedViews
      parameters: [{ name: resourceType, in: query, required: true, schema: { type: string } }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
    post:
      operationId: createSavedView
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/analytics/views/{id}:
    delete:
      operationId: deleteSavedView
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/exports:
    get:
      operationId: listExportJobs
      responses: { "200": { $ref: "#/components/responses/Success" } }
    post:
      operationId: createExportJob
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /api/v2/exports/{id}/download:
    get:
      operationId: downloadExport
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Governed CSV export } }
  /api/v2/admin/diagnostics:
    get:
      operationId: getAdminDiagnostics
      responses: { "200": { $ref: "#/components/responses/Success" }, "403": { $ref: "#/components/responses/Error" } }

components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: SESSION }
  parameters:
    CsrfHeader: { name: X-XSRF-TOKEN, in: header, required: true, schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: integer, format: int64 } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
  responses:
    Success:
      description: Successful response with request correlation ID
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Error:
      description: Stable, localized API error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    ApiResponse:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        requestId: { type: string }
    ApiError:
      type: object
      required: [code, messageKey, args, fieldErrors, requestId]
      properties:
        code: { type: string }
        messageKey: { type: string }
        args: { type: object, additionalProperties: true }
        fieldErrors: { type: array, items: { $ref: "#/components/schemas/FieldError" } }
        requestId: { type: string }
    FieldError:
      type: object
      required: [field, code, messageKey]
      properties:
        field: { type: string }
        code: { type: string }
        messageKey: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 190 }
        password: { type: string, format: password }
        mfaCode: { type: string, description: Six-digit TOTP or one-time recovery code. }
