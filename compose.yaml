services:
  mysql:
    build: { context: ., dockerfile: deploy/mysql/Dockerfile }
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flowora_erp
      MYSQL_USER: flowora
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"], interval: 10s, timeout: 5s, retries: 12 }
  redis:
    build: { context: ., dockerfile: deploy/redis/Dockerfile }
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG'], interval: 10s, timeout: 5s, retries: 12 }
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/flowora_erp?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: flowora
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FLOWORA_MFA_ENCRYPTION_KEY: ${FLOWORA_MFA_ENCRYPTION_KEY}
      FLOWORA_ALLOWED_ORIGINS: ${FLOWORA_ALLOWED_ORIGINS}
    volumes: ["flowora-data:/var/lib/flowora"]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:9090/actuator/health/readiness | grep -q UP"], interval: 15s, timeout: 5s, retries: 12 }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on: { api: { condition: service_healthy } }
  prometheus:
    build: { context: ., dockerfile: deploy/prometheus/Dockerfile }
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes: ["./deploy/prometheus:/etc/prometheus:ro", "prometheus-data:/prometheus"]
    depends_on: [api]

volumes:
  mysql-data:
  redis-data:
  flowora-data:
  prometheus-data:
